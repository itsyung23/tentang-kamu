<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bce6f8">
  <meta name="description" content="Lima belas potret dan hal-hal kecil tentang dia, di antara langit cerah dan bunga.">
  <title>Semua tentang kamu</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23bce6f8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ffcc50'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="photo-loader.js" defer></script>
  <script src="script.js" defer></script>
  <script src="nature.js" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="sky-wash" aria-hidden="true"></div>

  <div class="intro" id="intro" role="status">
    <span class="intro-spark" aria-hidden="true">✿</span>
    <p>merangkai kenangan manis</p>
    <div class="loading-track"><span></span></div>
    <span class="intro-note">senyumnya bikin hari lebih cerah</span>
  </div>

  <header class="topbar">
    <div class="wordmark"><span aria-hidden="true">✳</span><span id="site-name">tentang kamu</span></div>
    <div class="controls">
      <button class="icon-button" id="motion-toggle" type="button" aria-label="Jeda animasi" aria-pressed="false" title="Jeda animasi">
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg>
      </button>
      <button class="icon-button" id="music-toggle" type="button" aria-label="Putar musik" aria-pressed="false" title="Putar musik" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="17" rx="3" ry="2"/><ellipse cx="17" cy="15" rx="3" ry="2"/></svg>
      </button>
    </div>
  </header>

  <main class="memory-world" id="memory-world" aria-label="Foto-foto kenangan yang melayang">
    <div class="dedication">
      <p id="eyebrow">seseorang yang selalu bikin senyum</p>
      <h1 id="headline">Hal-hal indah<br><em>tentang kamu.</em></h1>
      <span class="dedication-star" aria-hidden="true">✧</span>
    </div>
    <div class="photos" id="photos"></div>
    <div class="nature" id="nature" aria-hidden="true"></div>
  </main>

  <footer class="bottom-note"><span aria-hidden="true">✧</span><p id="footer-text">sederhana, tapi istimewa. seperti kamu.</p><span aria-hidden="true">✧</span></footer>
  <p class="interaction-hint">sentuh fotonya, simpan senyumnya</p>
  <p class="toast" id="toast" role="status" hidden></p>

  <dialog id="photo-dialog" aria-label="Lihat foto kenangan">
    <button class="dialog-close icon-button" id="dialog-close" type="button" aria-label="Tutup foto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div class="enlarged-photo" id="enlarged-photo"></div>
    <p id="photo-caption"></p>
  </dialog>
</body>
</html>
